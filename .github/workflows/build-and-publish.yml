name: Build & publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wellbeing
          POSTGRES_PASSWORD: wellbeing
          POSTGRES_DB: wellbeing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wellbeing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wellbeing:wellbeing@localhost:5432/wellbeing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test

      # Migrations and the integration check run against a real Postgres: the
      # CHECK constraints, the partial unique index used for idempotent
      # medication check-off and the day-boundary handling can only be verified
      # against the database, not in a unit test.
      - run: npm run db:migrate
      - run: npm run db:check

  build:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # argocd-image-updater watches this tag pattern with the newest-build
      # strategy and writes the bump back to
      # helm/wellbeing/.argocd-source-wellbeing.yaml in the cluster repo.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/maikbuse/wellbeing:${{ github.sha }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
